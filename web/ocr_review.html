<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OCR 원문 대조</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#17283d;font:15px/1.6 system-ui,-apple-system,"Noto Sans KR",sans-serif}header{padding:24px 32px;background:#fff;border-bottom:1px solid #dce3ee}h1{margin:0;font-size:25px}h2{font-size:19px;margin:0 0 8px}p{margin:8px 0}.muted,small{color:#57677c}main{max-width:1600px;margin:auto;padding:20px}.toolbar,.panel{background:white;border:1px solid #dce3ee;border-radius:14px;padding:18px;margin-bottom:16px}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}button,select,input,textarea{font:inherit}button,select,input{border:1px solid #bccbdd;border-radius:8px;padding:8px 12px;background:#fff;color:#17283d}button{cursor:pointer}button.primary{background:#245edb;border-color:#245edb;color:white}button:disabled{opacity:.4;cursor:default}label{display:block}input[type=checkbox]{width:auto}.two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px}.raster-scroll{overflow:auto;max-height:78vh;background:#e7edf5;border-radius:10px}.raster-scroll svg{display:block;height:auto;max-width:none}.box{fill:transparent;stroke:#2873df;stroke-width:2;vector-effect:non-scaling-stroke;cursor:pointer}.box.active{stroke:#e87517;stroke-width:4;fill:#ffb54b33}textarea{width:100%;min-height:260px;resize:vertical;padding:12px;border:1px solid #adbed4;border-radius:10px;line-height:1.7}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:240px;overflow:auto;background:#f4f6fa;padding:12px;border-radius:10px}.warn{background:#fff5dd;border:1px solid #e8c16b;padding:12px;border-radius:10px}.words{display:flex;flex-wrap:wrap;gap:5px;max-height:160px;overflow:auto}.words button{padding:2px 7px;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.links a{margin-right:12px;word-break:break-all}#message{min-height:24px;color:#284d8d}input[type=text]{width:100%}#case{max-width:100%;flex:1;min-width:180px}summary{cursor:pointer}a{color:#1f5cc2}.hash{font:12px/1.5 ui-monospace,monospace;overflow-wrap:anywhere}@media(max-width:850px){header{padding:18px}main{padding:10px}.two{grid-template-columns:1fr}.raster-scroll{max-height:60vh}.toolbar,.panel{padding:13px}h1{font-size:22px}}
</style></head><body><header><small>청주시의회 토론회 첨부 · 전사 대조용</small><h1>원문을 보며 OCR 후보를 확인하세요</h1><p class="muted">원문 기반 전처리 이미지와 OCR 좌표를 대조합니다. 검토 기록은 기기에만 보관되며 분석 승인으로 전환되지 않습니다.</p></header><main><div class="warn">사진·도형을 글자로 오인할 수 있습니다. OCR 신뢰도는 정확도가 아닙니다. 원본의 내용·의원 귀속·정책 관심은 이 화면에서 확정하지 않습니다.</div><p id="message" role="status">묶음과 이미지 해시를 확인하고 있습니다…</p><section id="app" hidden><div class="toolbar"><button id="prev">이전</button><select id="case" aria-label="검토 대상"></select><button id="next">다음</button><span id="counts"></span></div><div class="toolbar"><button id="export" class="primary">검토 JSONL 저장</button><button id="backup">전체 백업 저장</button><label>검토 기록 불러오기 <input id="import" type="file" accept=".json,.jsonl"></label><button id="undo" disabled>불러오기 되돌리기</button><small>브라우저 임시 보관과 별도로 파일을 저장하세요.</small></div><div id="content"></div></section></main>
<script id="packet" type="application/json">__OCR_PACKET__</script><script>__OCR_CORE__</script><script>
'use strict';const raw=document.getElementById('packet').textContent,packet=JSON.parse(raw),core=CouncilOCRReview,expected='__OCR_PACKET_SHA__';let records=packet.records,index=0,reviews={},selected=-1,zoom=1,boxes=true,previous=null,ready=false;const verified=new Set(),storageKey='cj-ocr-review-'+expected;
const $=id=>document.getElementById(id),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const labels={unreviewed:'미검토',draft:'수정 초안',checked_transcription:'전사 대조 기록',held:'보류'};
async function sha(b){if(!crypto?.subtle)throw Error('이 환경에서는 해시 검증을 할 수 없습니다. 최신 브라우저에서 파일을 여세요.');return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b)),x=>x.toString(16).padStart(2,'0')).join('');}
function message(t){$('message').textContent=t;}
function persist(){try{localStorage.setItem(storageKey,JSON.stringify({schema:'cheongju-ocr-review-backup/1',packet_sha256:expected,records:Object.values(reviews)}));message('이 브라우저에 임시 보관했습니다. 검토 JSONL/백업을 파일로 저장하세요.');}catch(e){message('브라우저 임시 보관 불가 — JSONL/백업 파일로 저장하세요.');}counts();}
function counts(){const badge=document.querySelector('[data-status-badge]');if(badge)badge.textContent=labels[reviews[records[index].key].status];const n={unreviewed:0,draft:0,checked_transcription:0,held:0};for(const x of Object.values(reviews))n[x.status]++;$('counts').textContent=Object.keys(n).map(k=>labels[k]+' '+n[k]).join(' · ');$('case').innerHTML=records.map((r,i)=>`<option value="${i}" ${i===index?'selected':''}>${i+1}. ${E(r.title)} · ${r.task.page_coordinate==='pdf_1based'?'PDF '+r.task.page+'쪽':'이미지'} · ${labels[reviews[r.key].status]}</option>`).join('');}
function svg(r){return `<svg viewBox="0 0 ${r.raster.width} ${r.raster.height}" style="width:${zoom*100}%" role="img" aria-label="OCR와 동일한 좌표의 원문 기반 이미지"><image href="${r.image_uri}" width="${r.raster.width}" height="${r.raster.height}"/>${boxes?r.words.map((w,i)=>`<rect class="box ${i===selected?'active':''}" data-word="${i}" x="${w.box[0]}" y="${w.box[1]}" width="${w.box[2]}" height="${w.box[3]}" tabindex="0"><title>${E(w.text)} · 엔진값 ${w.tesseract_confidence} (정확도 아님)</title></rect>`).join(''):''}</svg>`;}
function render(){if(!ready)return;const r=records[index],v=reviews[r.key];counts();$('prev').disabled=index===0;$('next').disabled=index===records.length-1;$('content').innerHTML=`<section class="panel"><h2>${E(r.title)}</h2><p>${r.task.page_coordinate==='pdf_1based'?'PDF '+r.task.page+'쪽 (인쇄면수와 다를 수 있음)':'단일 이미지 첨부'} · <b data-status-badge>${labels[v.status]}</b> · 분석 사용 불가</p><div class="links">${r.task.source_links.map(s=>`<a href="${E(s.url)}" target="_blank" rel="noopener noreferrer">공식 첨부 ↗</a>${s.source_refs.map(x=>x.official_url?`<a href="${E(x.official_url)}" target="_blank" rel="noopener noreferrer">공식 게시물 ↗</a>`:'').join('')}`).join('')}<a href="https://github.com/wildkim11/cheongju-council-archive_total/blob/${packet.source_commit}/${r.task.source_path}" target="_blank" rel="noopener noreferrer">고정 보존 원본 ↗</a></div></section><div class="two"><section class="panel"><div class="toolbar"><label><input id="boxes" type="checkbox" ${boxes?'checked':''}>단어 위치</label><label>확대 <input id="zoom" type="range" min="1" max="3" step="0.25" value="${zoom}"></label></div><p class="muted">OCR와 동일한 회색조·축소 전처리 이미지입니다. 원본 파일은 위 링크로 확인하세요.</p><div class="raster-scroll" id="raster">${svg(r)}</div><p id="word-info" class="muted">단어나 위치 상자를 누르면 해당 좌표를 확인할 수 있습니다.</p></section><section class="panel"><details open><summary>자동 OCR 후보 · 원본 보존</summary><pre>${E(r.ocr_text)}</pre></details><h2>대조·수정 초안</h2><textarea id="correction" aria-label="대조 수정문">${E(v.corrected_text)}</textarea><label>검토자 표기 <input id="reviewer" type="text" maxlength="200" value="${E(v.reviewer)}" placeholder="직접 입력"></label><label>수정·보류 사유 <textarea id="note" style="min-height:85px" maxlength="10000">${E(v.note)}</textarea></label><label><input id="source-checked" type="checkbox" ${v.source_checked?'checked':''}>해당 이미지 전체를 대조했습니다</label><div class="actions"><button data-mark="checked_transcription" class="primary">전사 대조 기록</button><button data-mark="held">보류 기록</button></div><p class="muted">수정하면 대조 확인이 해제되고 초안으로 돌아갑니다. 대조 기록도 분석 승인·정답 자료를 뜻하지 않습니다.</p><details><summary>단어 후보 ${r.words.length}개 · 위치 찾기</summary><div class="words">${r.words.map((w,i)=>`<button data-word="${i}">${E(w.text)}</button>`).join('')}</div></details></section></div><details class="panel"><summary>출처·해시·처리 기준</summary><p>자료 기준 ${packet.source_commit} · ${E(packet.engine.tesseract_version)}</p><p class="hash">원본 ${r.task.source_sha256}<br>OCR 문서 ${r.ocr_document_sha256}<br>OCR 텍스트 ${r.ocr_text_sha256}<br>전처리 픽셀 ${r.raster.pixel_sha256}<br>검토 묶음 ${expected}</p><p>단어 좌표는 전처리 이미지 기준입니다. OCR값과 원본을 자동으로 고치거나 저장소에 전송하지 않습니다.</p></details>`;}
async function show(i){if(!Number.isInteger(i)||i<0||i>=records.length)return;ready=false;$('app').hidden=true;message('선택 이미지 해시 확인 중…');const r=records[i];try{if(!verified.has(r.key)){const bytes=Uint8Array.from(atob(r.image_uri.split(',')[1]),x=>x.charCodeAt(0));if(await sha(bytes)!==r.image_sha256)throw Error('이미지 해시 불일치 — 대조를 중단합니다');verified.add(r.key);}index=i;selected=-1;zoom=1;ready=true;$('app').hidden=false;render();message('자동 추출·미검토 후보입니다. 원문 대조 후 파일로 저장하세요.');}catch(e){message(e.message);}}
function download(value,name,type){const url=URL.createObjectURL(new Blob([value],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);}
$('prev').onclick=()=>show(index-1);$('next').onclick=()=>show(index+1);$('case').onchange=e=>show(Number(e.target.value));
document.addEventListener('input',e=>{if(!ready)return;const map={correction:'corrected_text',note:'note',reviewer:'reviewer','source-checked':'source_checked'},field=map[e.target.id];if(field){const r=records[index];reviews[r.key]=core.edit(reviews[r.key],field,e.target.type==='checkbox'?e.target.checked:e.target.value);if(field!=='source_checked')$('source-checked').checked=false;persist();}if(e.target.id==='zoom'){zoom=Number(e.target.value);$('raster').innerHTML=svg(records[index]);}});
document.addEventListener('change',e=>{if(e.target.id==='boxes'){boxes=e.target.checked;$('raster').innerHTML=svg(records[index]);}});
function word(i){const r=records[index];if(!r.words[i])return;selected=i;$('raster').innerHTML=svg(r);const w=r.words[i];$('word-info').textContent=w.text+' · 좌표 '+w.box.join(', ')+' · 엔진값 '+w.tesseract_confidence+' (정확도 아님)';const rect=$('raster').querySelector('[data-word="'+i+'"]');rect?.scrollIntoView({block:'center',inline:'center'});}
document.addEventListener('click',e=>{const w=e.target.closest('[data-word]');if(w){word(Number(w.dataset.word));return;}const b=e.target.closest('[data-mark]');if(b){const r=records[index];try{reviews[r.key]=core.mark(reviews[r.key],b.dataset.mark,r,expected);persist();render();}catch(error){message(error.message);}}});document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset.word!==undefined){e.preventDefault();word(Number(e.target.dataset.word));}});
$('export').onclick=()=>download(Object.values(reviews).map(v=>JSON.stringify(core.validate(v,records.find(r=>r.key===v.key),expected))).join('\n')+'\n','OCR_검토기록.jsonl','application/x-ndjson;charset=utf-8');
$('backup').onclick=()=>download(JSON.stringify({schema:'cheongju-ocr-review-backup/1',packet_sha256:expected,records:Object.values(reviews)},null,2),'OCR_검토백업.json','application/json;charset=utf-8');
$('import').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>40000000)throw Error('불러오기 파일 크기 초과');const next=core.importRows(await file.text(),records,reviews,expected);previous=reviews;reviews=next;$('undo').disabled=false;persist();render();message('검토 기록을 불러왔습니다. 필요하면 되돌릴 수 있습니다.');}catch(error){message('미적용: '+error.message);}finally{e.target.value='';}};
$('undo').onclick=()=>{if(!previous)return;reviews=previous;previous=null;$('undo').disabled=true;persist();render();};
(async()=>{try{if(await sha(new TextEncoder().encode(raw))!==expected)throw Error('검토 묶음 해시 불일치');for(const r of records)reviews[r.key]=core.blank(r,expected);try{const saved=localStorage.getItem(storageKey);if(saved)reviews=core.importRows(saved,records,reviews,expected);}catch(e){message('임시 보관 기록을 불러오지 못했습니다. 원본 파일을 보존하세요.');}await show(0);}catch(e){message('검토 중단: '+e.message);}})();
window.__ocrReview={getRecords:()=>records,getReviews:()=>reviews,show,getPacket:()=>packet,getPacketHash:()=>expected,importText:text=>{reviews=core.importRows(text,records,reviews,expected);persist();render();}};
</script></body></html>
