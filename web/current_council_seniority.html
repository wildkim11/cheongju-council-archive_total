<script>const data=JSON.parse(document.getElementById('data').textContent);
const el=id=>document.getElementById(id);
function render(){
  const query=el('query').value.trim();
  const minimum=Number(el('minimum').value);
  const order=el('order').value;
  const rows=data.filter(row=>row.name.includes(query)&&row.n>=minimum);
  rows.sort((a,b)=>(order==='wins'?b.n-a.n:0)||a.name.localeCompare(b.name,'ko'));
  el('count').textContent=rows.length+'명 / '+data.length+'명';
  el('results').replaceChildren();
  for(const row of rows){
    const tr=el('results').insertRow();
    const name=document.createElement('th'); name.scope='row'; name.textContent=row.name; tr.append(name);
    tr.insertCell().textContent='최소 '+row.n+'선';
    const details=document.createElement('details');
    const summary=document.createElement('summary');summary.textContent='당선 근거 '+row.events.length+'건 · 의회 자료';details.append(summary);
    const profile=document.createElement('a');
    profile.href=row.council.url; profile.textContent='청주시의회 공식 프로필'; details.append(profile);
    if(row.council.mentions.length){
      const career=document.createElement('p'); career.textContent=row.council.mentions.join(' · ');details.append(career);
    }
    const list=document.createElement('ul');details.append(list);
    for(const event of row.events){
      const item=document.createElement('li');
      const link=document.createElement('a');link.href=event.url;link.textContent=event.heading;item.append(link);
      if(event.councilUrl){
        const council=document.createElement('a');council.href=event.councilUrl;council.textContent=event.meetingDate ? event.meetingDate+' '+event.meetingLabel+' 회의록' : '청주시의회 대조 근거';item.append(' · ',council);
      }
      list.append(item);
    }
    tr.insertCell().append(details);
  }
}
el('query').addEventListener('input',render);
for(const id of ['minimum','order'])el(id).addEventListener('change',render);
render();</script></html>
