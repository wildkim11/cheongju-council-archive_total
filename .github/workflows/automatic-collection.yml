name: Automatic source collection (macOS)
on:
  workflow_dispatch:
    inputs:
      family:
        description: Daily full cycle or failed-source retry
        default: all
        type: choice
        options: [all, retry, bootstrap, minutes, bills, activities, people, groups, media, attachments]
permissions:
  contents: read
concurrency:
  group: cheongju-source-collection
  cancel-in-progress: false
jobs:
  gate:
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/archive-foundation
          sparse-checkout: scripts
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read collection status only; do not contact official sites
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let state = {};
            try {
              const {data} = await github.rest.repos.getContent({
                ...context.repo, ref: 'feature/archive-foundation',
                path: 'reports/automatic/collection_state.json'
              });
              if (data.encoding !== 'base64' || !data.content) throw new Error('Collection state unavailable');
              state = JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            fs.writeFileSync(process.env.RUNNER_TEMP + '/collection-state.json', JSON.stringify(state));


            let recovery = {schema:'cheongju-runner-recovery/1'};
            let recoverySha = null;
            try {
              const {data} = await github.rest.repos.getContent({
                ...context.repo, ref:'feature/archive-foundation',
                path:'reports/automatic/runner_recovery.json'
              });
              recovery = JSON.parse(Buffer.from(data.content,'base64').toString('utf8'));
              recoverySha = data.sha;
            } catch(e) { if(e.status !== 404) throw e; }
            fs.writeFileSync(process.env.RUNNER_TEMP + '/runner-recovery.json',JSON.stringify(recovery));
            fs.writeFileSync(process.env.RUNNER_TEMP + '/runner-recovery-sha.json',JSON.stringify(recoverySha));
            // GitHub metadata only: detect failure before the first macOS step.
            const {data:recent} = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id:'automatic-collection.yml', per_page:50
            });
            const cutoff = Date.now() - 24*60*60*1000;
            const failed = recent.workflow_runs.filter(r => r.status==='completed' &&
              r.conclusion==='failure' && Date.parse(r.updated_at)>=cutoff)
              .sort((a,b)=>Date.parse(b.updated_at)-Date.parse(a.updated_at))[0];
            let failure = null;
            if(failed) {
              const {data} = await github.rest.actions.listJobsForWorkflowRun({
                ...context.repo, run_id:failed.id, per_page:100
              });
              failure = {id:failed.id,run_attempt:failed.run_attempt,status:failed.status,
                conclusion:failed.conclusion,created_at:failed.created_at,updated_at:failed.updated_at,
                jobs:data.jobs.map(j=>({name:j.name,status:j.status,conclusion:j.conclusion,steps:j.steps}))};
            }
            fs.writeFileSync(process.env.RUNNER_TEMP + '/runner-failure.json',JSON.stringify(failure));

            // Checkpoint coverage is separate from this gate job's success.
            const families = ['minutes','bills','activities','people','groups','media','attachments'];
            const records = families.map(name => {
              const item = state.families?.[name] || {};
              return [name, item.last_success_at || 'No successful checkpoint',
                String(item.consecutive_failures || 0)];
            });
            const verified = families.filter(name => state.families?.[name]?.last_success_at).length;
            await core.summary
              .addHeading('Source collection checkpoints')
              .addRaw('This gate reads GitHub state only. Its success does not mean official-site collection ran.\n\n')
              .addRaw('Families with a recorded success: ' + verified + '/' + families.length + '. These are historical checkpoints, not a freshness guarantee.\n\n')
              .addTable([[{data:'Family',header:true},{data:'Last recorded success (UTC)',header:true},{data:'Consecutive failures',header:true}], ...records])
              .write();
      - name: Choose daily collection or due failures only
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_FAMILY: ${{ inputs.family || 'all' }}
        run: |
          python scripts/collection_policy.py plan \
            --state "$RUNNER_TEMP/collection-state.json" \
            --event "$EVENT_NAME" --schedule "$EVENT_SCHEDULE" --requested "$REQUESTED_FAMILY" \
            --runner-failure "$RUNNER_TEMP/runner-failure.json" \
            --runner-recovery "$RUNNER_TEMP/runner-recovery.json" \
            --runner-decision "$RUNNER_TEMP/runner-decision.json"
      - name: Reserve bounded startup retry before requesting macOS
        if: steps.plan.outputs.mode == 'startup_retry'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.RUNNER_TEMP + '/runner-decision.json');
            const sha = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/runner-recovery-sha.json','utf8'));
            await github.rest.repos.createOrUpdateFileContents({
              ...context.repo,branch:'feature/archive-foundation',
              path:'reports/automatic/runner_recovery.json',
              message:'ops: reserve bounded collection startup recovery',
              content:body.toString('base64'),...(sha ? {sha} : {})
            });
            const decision = JSON.parse(body.toString('utf8'));
            await core.summary.addHeading('Collection startup retry reserved')
              .addRaw('Official collection has not run in this gate. Selected families: ' + decision.pending_targets.join(', ') + '\n')
              .addRaw('Korean-day startup retry budget: ' + decision.retry_attempts_today + '/3.\n').write();
  collect:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    permissions:
      contents: write
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/archive-foundation
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate code and saved archive
        run: |
          python -m unittest discover -s tests
          python scripts/validate_archive.py
          python scripts/audit_stage_c.py --output /tmp/before-collection.json
      - name: Collect into isolated candidate and publish only after validation
        id: collection
        continue-on-error: true
        env:
          COLLECTION_FAMILY: ${{ needs.gate.outputs.mode }}
        run: bash scripts/collect_and_checkpoint.sh "$COLLECTION_FAMILY"
      - name: Persist validated snapshot and retry state
        if: always() && steps.collection.outcome != 'skipped'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archive indexes exports reports
          if ! git diff --cached --quiet; then
            git commit -m "data: automatic official collection and durable retry state"
            bash scripts/push_collected_snapshot.sh
          fi
      - name: Preserve collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automatic-collection-report
          path: |
            reports/automatic-collection-latest.json
            reports/automatic/collection_state.json
          if-no-files-found: warn
      - name: Surface collection failure after preserving retry state
        if: steps.collection.outcome == 'failure'
        run: exit 1
