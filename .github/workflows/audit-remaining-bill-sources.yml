name: QA remaining bill and institutional links
on:
  push:
    branches:
      - feature/archive-foundation
    paths:
      - scripts/audit_remaining_bill_sources.py
      - tests/test_remaining_bill_sources.py
      - .github/workflows/audit-remaining-bill-sources.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify static exception ledger tests
        run: python -m unittest discover -s tests -p test_remaining_bill_sources.py
      - name: Read saved source bills and relationship identities
        run: python scripts/audit_remaining_bill_sources.py
      - name: Preserve exception report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bill-pending-and-institutional-source-qa
          path: reports/bill-pending-and-institutional-source-qa.json
          if-no-files-found: warn
