name: One-time macOS original-TLS provisional and tree root check
on:
  push:
    branches:
      - feature/archive-foundation
    paths:
      - .github/workflows/official-macos-provisional-tree-once.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: official-macos-provisional-tree-one-shot
  cancel-in-progress: false
jobs:
  macos-original-tls-provisional-tree:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/archive-foundation
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate baseline archive originals and source-only fixtures
        run: |
          python -m unittest discover -s tests -p test_official_readonly_limited.py -v
          python scripts/audit_stage_c.py --output /tmp/stage-c-before-macos-4019.json
      - name: Use original collector TLS for only 4019 viewer and term tree root
        run: python -u scripts/probe_official_macos_original_tls_4019_tree.py
      - name: Require no source updates and bounded read-only requests
        run: |
          python - <<'PY'
          import json
          r=json.load(open("reports/official-macos-original-tls-4019-tree-20261102.json"))
          assert r["request_cap"]==2 and r["attempts"]<=2 and r["retries"]==0
          assert r["runner"]=="GitHub hosted macOS"
          assert not r["source_archive_modified"]
          assert not r["production_collection_enabled"]
          assert not r["operational_release_authorized"]
          PY
          git diff --exit-code -- archive indexes exports
      - name: Preserve evidence only in feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/official-macos-original-tls-4019-tree-20261102.json
          if ! git diff --cached --quiet; then
            git commit -m "qa: record original-TLS macOS 4019 provisional body and term root results"
            git fetch origin feature/archive-foundation
            git rebase origin/feature/archive-foundation
            git push origin HEAD:feature/archive-foundation
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-original-tls-4019-and-generation-tree
          path: reports/official-macos-original-tls-4019-tree-20261102.json
          if-no-files-found: warn
