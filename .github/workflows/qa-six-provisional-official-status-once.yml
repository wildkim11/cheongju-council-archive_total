name: One-time six provisional official leaf status verification on macOS
# One-time official status QA completed. Re-running requires explicit manual dispatch.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: one-shot-official-six-provisional
  cancel-in-progress: false
jobs:
  official-six-status:
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/archive-foundation
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test official status classification and baseline 2339 original hashes
        run: |
          python -m unittest discover -s tests -p test_six_provisional_official_states.py -v
          python scripts/audit_stage_c.py --output /tmp/stagec-before-six-status.json
      - name: Read four exact official committee nodes only on original TLS macOS
        run: python -u scripts/probe_six_provisional_official_states_macos.py
      - name: Require source unchanged and official request cap
        run: |
          python - <<'PY'
          import json
          r=json.load(open('reports/official-six-provisional-status-20261102.json'))
          assert r['requests_attempted']<=4 and r['retries']==0
          assert not r['source_archive_modified']
          assert not r['old_snapshot_modified']
          assert not r['production_sync_enabled']
          assert not r['operational_release_authorized']
          assert r['status'] in {
            'PASS_ALL_SIX_OFFICIAL_STATUS_VERIFIED',
            'PARTIAL_TARGETED_VERIFICATION',
            'UNVERIFIED_OFFICIAL_LEAF_MISSING_OR_UNKNOWN',
          }
          PY
          git diff --exit-code -- archive indexes exports
      - name: Publish strictly read-only findings to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/official-six-provisional-status-20261102.json
          if ! git diff --cached --quiet; then
            git commit -m "qa: store six official provisional live-status observations without overwriting archive"
            git fetch origin feature/archive-foundation
            git rebase origin/feature/archive-foundation
            git push origin HEAD:feature/archive-foundation
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: six-provisional-official-status-readonly
          path: reports/official-six-provisional-status-20261102.json
          if-no-files-found: warn
