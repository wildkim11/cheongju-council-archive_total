name: One-time official bill source link probe
on:
  push:
    branches:
      - feature/archive-foundation
    paths:
      - .github/workflows/probe-bill-official-links-once.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bill-official-links-once
  cancel-in-progress: true
jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test safe link extraction
        run: python -m unittest discover -s tests -p test_bill_official_links.py
      - name: Official-source detail and announcement HTML probe
        run: python -u scripts/probe_bill_official_attachments.py
      - name: Preserve read-only official page evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bill-official-source-links
          path: reports/bill-official-source-link-probe.json
          if-no-files-found: warn
