name: One-time population stage B1 bills

on:
  push:
    branches:
      - population-stage-b1-trigger

permissions:
  contents: write

concurrency:
  group: archive-population-stage-b1
  cancel-in-progress: true

jobs:
  populate:
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/archive-foundation
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test foundation before collection
        run: python -m unittest discover -s tests
      - name: Require stage A people data
        run: |
          test -s archive/people/people.json
          test -s archive/people/history/cheongju_integrated_people.json
      - name: Collect official bills and resolutions
        run: python -u scripts/collect_bills.py
      - name: Repair proposer arrays against term rosters
        run: python -u scripts/repair_bill_proposer_rosters.py
      - name: Link bill proposer names to term-scoped people
        run: python -u scripts/link_bill_proposers.py
      - name: Validate archive
        run: |
          python scripts/validate_archive.py
          python -m unittest discover -s tests
      - name: Build analyzer export
        run: python scripts/export_analyzer.py
      - name: Publish verified stage B1 data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archive reports exports
          if ! git diff --cached --quiet; then
            git commit -m "data: populate archive stage B1 bills"
            git fetch origin feature/archive-foundation
            git rebase origin/feature/archive-foundation
            git push origin HEAD:feature/archive-foundation
          fi
