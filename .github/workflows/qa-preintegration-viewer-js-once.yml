name: One-time official oldcity oldcounty viewer JS route verification on macOS
# Source-reading one-time QA completed. No push-triggered or recurring reruns.
# A further official source request requires explicit workflow_dispatch.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: premerger-two-viewer-js-qacheck
  cancel-in-progress: false
jobs:
  viewer-links:
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/archive-foundation
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baseline archive SHA QA
        run: python scripts/audit_stage_c.py --output /tmp/before-official-two-viewer-js.json
      - name: Read two official async tree scripts linked from confirmed portals
        run: python -u scripts/probe_official_preintegration_viewer_js_macos.py
      - name: Verify no source edits or network overreach
        run: |
          python - <<'PY'
          import json
          j=json.load(open('reports/official-preintegration-viewer-js-readonly-20261102.json'))
          assert j['requests_attempted']==2 and j['request_cap']==2 and j['retries']==0
          assert not j['archive_modified'] and not j['prod_sync_enabled']
          assert j['existing_minutes_saved']==0
          assert j['status'] in {'PASS_TWO_OFFICIAL_VIEWER_CLICK_JS_READ','INCONCLUSIVE_LEGACY_VIEWER_JS'}
          PY
          git diff --exit-code -- archive indexes exports
      - name: Preserve official viewer reference metadata only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/official-preintegration-viewer-js-readonly-20261102.json
          if ! git diff --cached --quiet; then
            git commit -m "qa: preserve legacy official viewer JavaScript URL evidence only"
            git fetch origin feature/archive-foundation
            git rebase origin/feature/archive-foundation
            git push origin HEAD:feature/archive-foundation
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-city-county-viewer-route-metadata
          path: reports/official-preintegration-viewer-js-readonly-20261102.json
          if-no-files-found: warn
