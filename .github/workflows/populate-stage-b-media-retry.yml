name: One-time population stage B media retry

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage-b-media-retry
  cancel-in-progress: true

jobs:
  populate-media:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/archive-foundation
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require persisted stage B checkpoints
        run: |
          test -s archive/bills/items.json
          test -s archive/bills/proposer_memberships.json
          test -s archive/activities/five_minute_speeches.json
          test -s archive/activities/city_questions.json
          test -s archive/activities/written_questions.json
          test -s archive/activities/suggestions_resolutions.json
      - name: Validate before media retry
        run: |
          python scripts/validate_archive.py
          python -m unittest discover -s tests
      - name: Collect official press releases
        run: python -u scripts/collect_board_activities.py --kind press
      - name: Collect debates
        run: python -u scripts/collect_board_activities.py --kind debate
      - name: Collect photo activity metadata only
        run: python -u scripts/collect_photo_activity.py
      - name: Rebuild identity candidates
        run: python -u scripts/build_identity_candidates.py
      - name: Validate media checkpoint
        run: |
          python scripts/validate_archive.py
          python -m unittest discover -s tests
      - name: Build final analyzer export for stage B
        run: python scripts/export_analyzer.py
      - name: Publish verified media checkpoint
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add archive reports exports
          if ! git diff --cached --quiet; then
            git commit -m "data: populate archive stage B media"
            git fetch origin feature/archive-foundation
            git rebase origin/feature/archive-foundation
            git push origin HEAD:feature/archive-foundation
          fi
