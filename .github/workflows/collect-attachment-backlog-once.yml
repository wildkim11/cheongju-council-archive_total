name: Continue four attachment backlog batches
on:
  push:
    branches: [feature/archive-foundation]
    paths: [.github/workflows/collect-attachment-backlog-once.yml]
permissions:
  contents: read
concurrency:
  group: cheongju-source-collection
  cancel-in-progress: false
jobs:
  collect:
    permissions:
      contents: write
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/archive-foundation
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate code and saved archive
        run: |
          python -m unittest discover -s tests
          python scripts/validate_archive.py
          python scripts/audit_stage_c.py --output /tmp/before-collection.json
      - name: Collect into isolated candidate and publish only after validation
        id: collection
        continue-on-error: true
        env:
          COLLECTION_FAMILY: attachments
        run: |
          set -euo pipefail
          for batch in 1 2 3 4; do
            echo "Starting attachment batch $batch of 4"
            bash scripts/collect_and_checkpoint.sh "$COLLECTION_FAMILY"
          done
      - name: Persist validated snapshot and retry state
        if: always() && steps.collection.outcome != 'skipped'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archive indexes exports reports
          if ! git diff --cached --quiet; then
            git commit -m "data: automatic official collection and durable retry state"
            bash scripts/push_collected_snapshot.sh
          fi
      - name: Preserve collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attachment-collection-checkpoints
          path: |
            reports/automatic-collection-latest.json
            reports/automatic/collection_state.json
          if-no-files-found: warn
      - name: Surface collection failure after preserving retry state
        if: steps.collection.outcome == 'failure'
        run: exit 1

  extract:
    needs: collect
    if: ${{ !cancelled() }}
    permissions:
      contents: write
    uses: ./.github/workflows/process-attachment-text.yml
    with:
      caller_holds_collection_lock: true
