name: One-time macOS official term4 new ID discovery read-only
# One-time live official ID discovery completed; manual rerun only.
# No scheduled or push-triggered official requests.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-time-macos-official-term4-inventory
  cancel-in-progress: false

jobs:
  term4-new-ids:
    runs-on: macos-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/archive-foundation
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline mock-tree regression tests and full 2339 original hash validation
        run: |
          python -m unittest discover -s tests -p test_official_term4_new_meeting_ids.py -v
          python scripts/audit_stage_c.py --output /tmp/stagec-term4-new-id-before.json
      - name: Enumerate term4 metadata via bounded official source requests (no bodies or writes)
        run: python -u scripts/probe_official_term4_new_meeting_ids_macos.py
      - name: Verify no production changes and fail-closed request budget
        run: |
          python - <<'PY'
          import json
          report=json.load(open('reports/official-term4-new-meeting-id-discovery-20261102.json',encoding='utf-8'))
          assert report['schema']=='official-term4-new-ids-bounded-live-inventory/1'
          assert report['request_limit']==80
          assert report['requests_attempted']<=80
          assert report['retries']==0
          assert report['saved_total_meeting_count']==2339
          assert report['saved_term4_count']==50
          assert report['raw_meeting_bodies_downloaded']==0
          assert not report['archive_files_modified']
          assert not report['existing_source_files_modified']
          assert not report['production_sync_enabled']
          assert not report['production_archive_update_allowed']
          assert not report['operational_release_authorized']
          assert report['conclusion'] in {
            'INCONCLUSIVE_PARTIAL_OFFICIAL_TERM4_INVENTORY',
            'TERM4_INVENTORY_HAS_REVIEW_CANDIDATES',
            'NO_NEW_OR_CHANGED_TERM4_METADATA_IN_OFFICIAL_INVENTORY'
          }
          assert all(not row['auto_apply'] for row in report['new_source_id_candidates'])
          PY
          git diff --exit-code -- archive indexes exports
      - name: Preserve read-only live inventory evidence on feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/official-term4-new-meeting-id-discovery-20261102.json
          if ! git diff --cached --quiet; then
            git commit -m "qa: record bounded official term4 inventory new ID candidates without archive mutation"
            git fetch origin feature/archive-foundation
            git rebase origin/feature/archive-foundation
            git push origin HEAD:feature/archive-foundation
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-term4-new-id-readonly-inventory
          path: reports/official-term4-new-meeting-id-discovery-20261102.json
          if-no-files-found: warn
