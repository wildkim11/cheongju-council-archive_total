name: One-time bill proposer minutes fallback audit

on:
  push:
    branches:
      - feature/archive-foundation
    paths:
      - scripts/find_bill_minutes_fallback.py
      - tests/test_bill_minutes_fallback.py
      - .github/workflows/bill-minutes-fallback-audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bill-minutes-fallback-audit
  cancel-in-progress: true

jobs:
  reconcile-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test candidate matching safeguards
        run: python -m unittest discover -s tests -p test_bill_minutes_fallback.py
      - name: Search saved Stage C minutes for 25 bill titles
        run: python scripts/find_bill_minutes_fallback.py
      - name: Upload read-only candidate evidence ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bill-minutes-fallback-candidates
          path: reports/bill-minutes-fallback-candidates.json
          if-no-files-found: warn
