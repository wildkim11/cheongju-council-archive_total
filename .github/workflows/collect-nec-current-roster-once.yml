name: Capture remaining current-roster NEC election searches on macOS
on:
  # Bounded 44-name snapshot completed; any additional source queries are manual.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cheongju-nec-source-inspection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/archive-foundation
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_nec_current_roster_collection.py
      - run: python -u scripts/collect_nec_current_roster.py
      - name: Preserve bounded roster query responses and diagnostics
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archive/elections/nec reports/nec-current-roster-collection-latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: preserve current-roster NEC name-query snapshot'
            git fetch origin feature/archive-foundation
            git rebase origin/feature/archive-foundation
            git push origin HEAD:feature/archive-foundation
          fi
