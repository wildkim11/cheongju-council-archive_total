name: Process archived meeting records (offline)
on:
  push:
    branches: [feature/archive-foundation]
    paths:
      - scripts/process_meeting_segments.py
      - scripts/resolve_activity_spacing_matches.py
      - scripts/review_activity_date_discrepancies.py
      - scripts/build_question_answer_parts.py
      - scripts/resolve_question_answer_links.py
      - scripts/review_single_activity_differences.py
      - scripts/build_member_text_inputs.py
      - scripts/build_topic_review_materials.py
      - scripts/build_topic_review_ui.py
      - web/topic_review.html
      - tests/test_topic_review_ui.py
      - scripts/build_topic_review_drafts.py
      - archive/analysis_annotations/**/ai_draft_*.jsonl
      - config/policy_topics_v1.json
      - docs/policy-topic-coding-v1.md
      - scripts/review_question_identity_evidence.py
      - docs/analysis-methods-v1.md
      - scripts/verify_processing.py
      - scripts/export_minutes_text.py
      - scripts/build_activity_temporal_context.py
      - scripts/build_analysis_activity_gate.py
      - scripts/build_member_activity_counts.py
      - tests/test_process_meeting_segments.py
      - tests/test_resolve_activity_spacing_matches.py
      - tests/test_review_activity_date_discrepancies.py
      - tests/test_question_answer_parts.py
      - tests/test_question_answer_links.py
      - tests/test_single_activity_differences.py
      - tests/test_member_text_inputs.py
      - tests/test_topic_review_materials.py
      - tests/test_topic_review_drafts.py
      - tests/test_question_identity_evidence.py
      - tests/test_verify_processing.py
      - tests/test_export_minutes_text.py
      - tests/test_activity_temporal_context.py
      - tests/test_analysis_activity_gate.py
      - tests/test_member_activity_counts.py
      - .github/workflows/process-archived-records.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cheongju-source-collection
  cancel-in-progress: false
jobs:
  process:
    # No council-site HTTP/TLS here: only already preserved GitHub source files.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/archive-foundation
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test processing and validate stored originals
        run: |
          python -m unittest discover -s tests
          python scripts/validate_archive.py
          python scripts/audit_stage_c.py --output /tmp/processing-source-qa.json
      - name: Generate source-coordinate segments and activity roles
        run: python -u scripts/process_meeting_segments.py
      - name: Link unique complete activity bodies with spacing differences
        run: python -u scripts/resolve_activity_spacing_matches.py
      - name: Derive exact source-backed question and executive answer parts
        run: python -u scripts/build_question_answer_parts.py
      - name: Audit split-question source-term identity evidence without promotion
        run: python -u scripts/review_question_identity_evidence.py
      - name: Link unique complete questions with verified executive tails
        run: python -u scripts/resolve_question_answer_links.py
      - name: Verify every source range and derived ledger
        run: python -u scripts/verify_processing.py --out reports/processing-qa-latest.json
      - name: Review unmatched activity display-date discrepancies without promotion
        run: python -u scripts/review_activity_date_discrepancies.py
      - name: Preserve single-edit activity differences without promotion
        run: python -u scripts/review_single_activity_differences.py
      - name: Attach explicit historical intervals and hold unresolved context
        run: python -u scripts/build_activity_temporal_context.py
      - name: Partition source-attributed activity inputs and preserve held records
        run: python -u scripts/build_analysis_activity_gate.py
      - name: Aggregate member counts with row-level evidence
        run: python -u scripts/build_member_activity_counts.py
      - name: Build member-only text inputs using attribution and content gates
        run: python -u scripts/build_member_text_inputs.py
      - name: Prepare unlabelled policy-topic review tasks and development sample
        run: python -u scripts/build_topic_review_materials.py
      - name: Validate AI topic drafts without promoting human references or scores
        run: python -u scripts/build_topic_review_drafts.py
      - name: Build self-contained human review packet from verified snapshots
        run: python -u scripts/build_topic_review_ui.py
      - name: Export hash-verified meeting text for HTML consumers
        run: python -u scripts/export_minutes_text.py
      - name: Commit verified derived data only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/topic-draft-review-latest.json exports/topic-review reports/topic-review-materials-latest.json reports/question-answer-links-latest.json reports/question-identity-evidence-review.json reports/member-text-inputs-latest.json reports/activity-single-differences.json reports/question-answer-parts-latest.json reports/activity-date-discrepancies.json reports/activity-spacing-link-review.json exports/processing exports/minutes-text reports/member-activity-counts-latest.json reports/analysis-activity-gate-latest.json reports/temporal-context-latest.json reports/processing-latest.json reports/processing-qa-latest.json
          if ! git diff --cached --quiet; then
            git commit -m "data: verified speech segments and source-backed activity roles"
            bash scripts/push_collected_snapshot.sh
          fi
      - name: Preserve processing summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-processing-qa
          path: |
            reports/processing-latest.json
            reports/processing-qa-latest.json
            reports/activity-spacing-link-review.json
            reports/activity-date-discrepancies.json
            reports/question-answer-parts-latest.json
            reports/activity-single-differences.json
            reports/member-text-inputs-latest.json
            reports/question-identity-evidence-review.json
            reports/question-answer-links-latest.json
            reports/topic-review-materials-latest.json
            reports/topic-draft-review-latest.json
            reports/temporal-context-latest.json
            reports/analysis-activity-gate-latest.json
            reports/member-activity-counts-latest.json
          if-no-files-found: warn
