name: One-time official year 2026 4024 4025 4026 crosscheck macOS
on:
  push:
    branches:
      - feature/archive-foundation
    paths:
      - .github/workflows/qa-macos-year2026-three-new-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-year2026-three-new-crosscheck
  cancel-in-progress: false

jobs:
  crosscheck-three:
    runs-on: macos-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/archive-foundation
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit all original 2339 source files before official access
        run: python scripts/audit_stage_c.py --output /tmp/initial-2339-originals-three-new-year2026.json
      - name: Query 2026 official year tree only, secure TLS and no retry
        run: python -u scripts/probe_official_year2026_three_ids_macos.py
      - name: Require three exact ID matches and no original changes
        run: |
          python - <<'PY'
          import json
          j=json.load(open('reports/official-year2026-three-new-ids-presence-20261102.json'))
          assert j['status']=='PASS_THREE_NEW_IDS_IN_OFFICIAL_YEAR2026'
          assert j['requested_source_ids']==['4024','4025','4026']
          assert set(j['found'])=={'4024','4025','4026'}
          assert all(r['official_status_code']=='N' for r in j['found'].values())
          assert j['requests_attempted']<=75 and j['retries']==0
          assert not j['errors']
          assert not j['source_archive_modified']
          assert not j['production_collection_enabled']
          assert not j['operational_release_authorized']
          PY
          git diff --exit-code -- archive indexes exports
      - name: Commit evidence report only on isolated development branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/official-year2026-three-new-ids-presence-20261102.json
          if ! git diff --cached --quiet; then
            git commit -m "qa: preserve official 2026 year-tree N-state for new IDs 4024/4025/4026"
            git fetch origin feature/archive-foundation
            git rebase origin/feature/archive-foundation
            git push origin HEAD:feature/archive-foundation
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-year2026-three-new-id-proof
          path: reports/official-year2026-three-new-ids-presence-20261102.json
          if-no-files-found: warn
