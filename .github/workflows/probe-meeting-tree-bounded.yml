name: Retry two of one-time bounded meeting tree official-site probe
on:
  push:
    branches:
      - feature/archive-foundation
    paths:
      - .github/workflows/probe-meeting-tree-bounded.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bounded-meeting-tree-probe
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe selected years, terms and official viewer URLs with bounded requests
        run: python -u scripts/probe_meeting_tree_bounded.py
      - name: Retain auditable read-only probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meeting-tree-bounded-source-probe
          path: reports/official-tree-bounded-probe-20261102.json
          if-no-files-found: error
