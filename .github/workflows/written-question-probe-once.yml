name: One-time written question detail probe
on:
  push:
    branches:
      - feature/archive-foundation
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -u scripts/probe_written_question_detail.py
