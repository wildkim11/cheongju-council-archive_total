name: macOS runner smoke

on:
  push:
    branches:
      - stage-c-macos-smoke

permissions:
  contents: read

jobs:
  smoke:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/archive-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -u scripts/probe_official_source.py
