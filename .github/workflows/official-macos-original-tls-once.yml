name: One-time macOS original collector TLS settings check
# One-time bounded macOS official-source checks completed.
# No automatic or scheduled reruns are authorized.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: official-macos-original-tls-once
  cancel-in-progress: false
jobs:
  original-tls-probe:
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/archive-foundation
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate prior source exactly 2339 and read-only tests
        run: |
          python -m unittest discover -s tests -p test_official_readonly_limited.py -v
          python scripts/audit_stage_c.py --output /tmp/macos-original-tls-source-qa.json
      - name: Make ONE secure read-only GET for minutes 3999 using original TLS cipher configuration
        run: python -u scripts/probe_official_macos_original_tls.py
      - name: Require strict no-source-change and no-autocollection
        run: |
          python - <<'PY'
          import json
          r=json.load(open('reports/official-macos-original-tls-3999-20261102.json',encoding='utf-8'))
          assert r["runner"]=="macOS"
          assert r["certificate_validation_enabled"]
          assert r["tls_version_minimum"]=="TLSv1.2"
          assert r["http_requests_attempted"]==1 and r["automatic_retries"]==0
          assert r["original_archive_writes"]==0
          assert r["production_collection_enabled"] is False
          assert r["operational_release_authorized"] is False
          PY
          git diff --exit-code -- archive indexes exports
      - name: Publish one-request result to isolated feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/official-macos-original-tls-3999-20261102.json
          if ! git diff --cached --quiet; then
            git commit -m "qa: preserve one secure macOS original-cipher official minute GET outcome"
            git fetch origin feature/archive-foundation
            git rebase origin/feature/archive-foundation
            git push origin HEAD:feature/archive-foundation
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-macos-original-tls-3999
          path: reports/official-macos-original-tls-3999-20261102.json
          if-no-files-found: warn
