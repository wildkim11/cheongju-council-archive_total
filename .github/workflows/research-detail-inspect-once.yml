name: One-time historical research detail inspection

on:
  push:
    branches:
      - feature/archive-foundation

permissions:
  contents: read

jobs:
  inspect:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -u scripts/probe_historical_research_details.py
