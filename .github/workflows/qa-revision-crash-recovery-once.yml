name: One-time revision and process-crash recovery isolation verification
on:
  push:
    branches:
      - feature/archive-foundation
    paths:
      - .github/workflows/qa-revision-crash-recovery-once.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run ALL offline archive regression tests (incl. actual child-process exit)
        run: python -m unittest discover -s tests -v
      - name: Audit 8 isolated revision/failure behaviors
        run: python scripts/audit_incremental_sync_isolation.py
      - name: Check original saved archive hash and metadata integrity
        run: python scripts/audit_stage_c.py --output /tmp/post-revision-stage-c-audit.json
      - name: Block operational release and verify original source checkout unchanged
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("reports/incremental-sync-isolation-diagnostics.json").read_text(encoding="utf-8"))
          assert r["official_site_requests"]==0
          assert r["canonical_project_files_modified"] is False
          assert r["release_decision"]=="BLOCKED_UNSAFE_TO_OPERATE"
          assert r["release_blocker_count"]>=1
          assert all(r["successes"].values()),r["successes"]
          assert r["release_blockers"]["same_id_metadata_transition_requires_versioned_history"] is False
          assert r["release_blockers"]["same_id_content_revision_requires_versioned_history"] is False
          PY
          git diff --exit-code -- archive indexes exports
      - name: Preserve isolated version+crash evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-revision-crash-recovery-evidence
          path: reports/incremental-sync-isolation-diagnostics.json
          if-no-files-found: warn
