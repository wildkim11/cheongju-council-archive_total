name: One-time offline institutional bill source consistency
on:
  push:
    branches: [feature/archive-foundation]
    paths:
      - .github/workflows/institutional-bill-offline-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline_verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate zero institutional proposer contamination
        run: |
          python -m unittest discover -s tests -p test_institutional_bill_roles.py
          python scripts/audit_institutional_bill_roles.py
      - uses: actions/upload-artifact@v4
        with:
          name: institutional-44-offline-source-qa
          path: reports/institutional-bill-44-person-links-provenance.json
          if-no-files-found: error
