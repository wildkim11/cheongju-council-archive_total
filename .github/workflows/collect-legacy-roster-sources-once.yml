name: Capture preintegration council rosters
on:
  # Initial capture completed. Further source queries are manual.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cheongju-source-collection
  cancel-in-progress: false
jobs:
  capture:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/legacy_roster_sources.py
      - if: always()
        run: python scripts/build_cross_scope_identity_review.py
      - if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archive/source_responses reports/legacy-roster-source-collection-latest.json reports/cross-scope-identity-review-latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: preserve and verify preintegration roster sources'
            git fetch origin feature/archive-foundation
            git rebase origin/feature/archive-foundation
            git push origin HEAD:feature/archive-foundation
          fi
