name: Publish one-time incremental sync isolation safety ledger
# Completed initial isolation audit; subsequent runs require explicit dispatch.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: one-time-incremental-safety-ledger
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/archive-foundation
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify production interlock, dry-run safety cases and whole archive QA
        run: |
          python -m unittest discover -s tests
          python scripts/audit_incremental_sync_isolation.py
          python scripts/audit_stage_c.py --output /tmp/stage-c-integrity-after-isolated-fixes.json
      - name: Require explicit three remaining release gates and zero canonical mutations
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path("reports/incremental-sync-isolation-diagnostics.json").read_text(encoding="utf-8"))
          assert r["official_site_requests"]==0
          assert r["canonical_project_files_modified"] is False
          assert r["release_decision"]=="BLOCKED_UNSAFE_TO_OPERATE"
          assert r["release_blocker_count"]==3
          assert all(r["successes"].values()),r["successes"]
          b=r["release_blockers"]
          assert b["derived_exports_and_current_shards_not_updated"] is False
          assert b["publish_exception_can_leave_partial_target"] is False
          assert b["many_to_one_provisional_replacements_allowed"] is False
          assert b["same_id_metadata_transition_requires_versioned_history"]
          assert b["same_id_content_revision_requires_versioned_history"]
          assert b["unexpected_process_termination_crash_atomicity_not_proven"]
          PY
          git diff --exit-code -- archive indexes exports
      - name: Publish original-preserving isolation QA ledger to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/incremental-sync-isolation-diagnostics.json
          if ! git diff --cached --quiet; then
            git commit -m "qa: preserve verified offline incremental safety gate and three blockers"
            git fetch origin feature/archive-foundation
            git rebase origin/feature/archive-foundation
            git push origin HEAD:feature/archive-foundation
          fi
