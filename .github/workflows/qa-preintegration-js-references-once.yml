name: One-time macOS legacy Cheongju city/county official JS endpoint references
on:
  push:
    branches:
      - feature/archive-foundation
    paths:
      - .github/workflows/qa-preintegration-js-references-once.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: one-shot-legacy-official-js-reference-discovery
  cancel-in-progress: false
jobs:
  legacy-js-qa:
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/archive-foundation
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify unchanged official integrated archive baseline
        run: python scripts/audit_stage_c.py --output /tmp/legacy-js-originals-before.json
      - name: Read only four officially linked legacy tree JS sources
        run: python -u scripts/probe_official_preintegration_js_macos.py
      - name: Enforce strict read-only scope and request cap
        run: |
          python - <<'PY'
          import json
          r=json.load(open('reports/official-preintegration-js-endpoints-readonly-20261102.json'))
          assert r['requests_attempted']==4 and r['request_limit']==4 and r['retries']==0
          assert not r['archive_modified']
          assert not r['full_legacy_inventory_claimed']
          assert not r['production_collection_enabled']
          assert r['status'] in {'PASS_FOUR_OFFICIAL_LEGACY_SCRIPTS_READ','INCONCLUSIVE_LEGACY_SOURCE_SCRIPTS'}
          PY
          git diff --exit-code -- archive indexes exports
      - name: Commit metadata-only source discovery to development branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/official-preintegration-js-endpoints-readonly-20261102.json
          if ! git diff --cached --quiet; then
            git commit -m "qa: keep bounded official legacy city/county JS endpoint references only"
            git fetch origin feature/archive-foundation
            git rebase origin/feature/archive-foundation
            git push origin HEAD:feature/archive-foundation
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: old-city-old-county-official-js-route-discovery
          path: reports/official-preintegration-js-endpoints-readonly-20261102.json
          if-no-files-found: warn
