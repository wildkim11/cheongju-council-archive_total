name: Stage B network smoke

on:
  push:
    branches:
      - population-stage-b-smoke

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/archive-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Smoke five-minute speeches
        env:
          PYTHONPATH: scripts
        run: python -u scripts/collect_speeches_questions.py --kind five_minute --max-pages 3
      - name: Smoke press releases
        env:
          PYTHONPATH: scripts
        run: python -u scripts/collect_board_activities.py --kind press --max-pages 3
      - name: Smoke one bill detail
        env:
          PYTHONPATH: scripts
        run: python -u scripts/probe_bill_source.py
