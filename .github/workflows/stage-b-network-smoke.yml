name: Stage B network smoke

on:
  push:
    branches:
      - population-stage-b-smoke

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/archive-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe repeated bill-list access
        env:
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          from collect_bills import discover_term
          rows=discover_term(4,max_pages=40)
          print("term4_list_records",len(rows))
          if len(rows)<100:
              raise SystemExit("term4 list unexpectedly small")
          PY
      - name: Probe one bill detail
        env:
          PYTHONPATH: scripts
        run: python -u scripts/probe_bill_source.py
