name: Stage B network smoke

on:
  push:
    branches:
      - population-stage-b-smoke

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/archive-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe main council site
        run: |
          python - <<'PY'
          from scripts.collect_current_members import fetch_text, LIST_URL
          text=fetch_text(LIST_URL)
          print("main_site_bytes", len(text.encode("utf-8")))
          if "청주시의회" not in text:
              raise SystemExit("main site probe failed")
          PY
      - name: Probe one bill detail
        run: python -u scripts/probe_bill_source.py
