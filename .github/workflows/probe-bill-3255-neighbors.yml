name: One-time bounded withdrawn ordinance notice verification
# Historical read-only source probe completed; disable push reruns.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bill-3255-neighbor-readonly
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify nearby official public council notices
        run: python -u scripts/probe_bill_3255_neighbor_ids.py
      - name: Preserve source investigation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bill-3255-official-neighbors
          path: |
            reports/bill-3255-neighboring-official-notice-probe.json
            reports/official-attachments-probe/
          if-no-files-found: warn
