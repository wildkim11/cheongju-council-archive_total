name: One-time real 2014 premerger Cheongju city and Cheongwon county official bodies
# Source-reading one-time QA completed. No push-triggered or recurring reruns.
# A further official source request requires explicit workflow_dispatch.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: one-time-old-city-county-two-real-official-bodies
  cancel-in-progress: false
jobs:
  check-2-real-legacy-bodies:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/archive-foundation
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all original integrated meetings
        run: python scripts/audit_stage_c.py --output /tmp/pre-old-city-and-county-real-bodies.json
      - name: Official GET one body per premerger scope only, no raw body in repo
        run: python -u scripts/probe_official_preintegration_two_bodies_macos.py
      - name: Verify two proof-of-source bounded requests and archive intact
        run: |
          python - <<'PY'
          import json
          j=json.load(open('reports/official-preintegration-two-real-bodies-readonly-20261102.json'))
          assert j['requests_attempted']==2 and j['request_limit']==2
          assert j['retries']==0
          assert j['official_meeting_bodies_saved_to_archive']==0
          assert not j['existing_integrated_originals_modified']
          assert not j['production_collector_enabled']
          assert j['status'] in {'PASS_TWO_OFFICIAL_LEGACY_BODIES','INCONCLUSIVE_LEGACY_OFFICIAL_BODIES'}
          PY
          git diff --exit-code -- archive indexes exports
      - name: Publish only verified body metadata and hashes to feature
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/official-preintegration-two-real-bodies-readonly-20261102.json
          if ! git diff --cached --quiet; then
            git commit -m "qa: record real legacy city and county viewer body hashes without storing original text"
            git fetch origin feature/archive-foundation
            git rebase origin/feature/archive-foundation
            git push origin HEAD:feature/archive-foundation
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-independent-legacy-official-meeting-body-hashes
          path: reports/official-preintegration-two-real-bodies-readonly-20261102.json
          if-no-files-found: warn
