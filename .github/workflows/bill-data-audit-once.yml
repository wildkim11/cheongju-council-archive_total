name: One-time bill data audit

on:
  push:
    branches:
      - bill-data-audit-trigger

permissions:
  contents: write

concurrency:
  group: archive-bill-data-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/archive-foundation
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit populated bill data
        run: python scripts/audit_bill_archive.py
      - name: Publish audit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/bill-data-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "qa: record populated bill data audit"
            git fetch origin feature/archive-foundation
            git rebase origin/feature/archive-foundation
            git push origin HEAD:feature/archive-foundation
          fi
