name: One-time macOS official OLD Cheongju city and Cheongwon county term root trees
# Source-reading one-time QA completed. No push-triggered or recurring reruns.
# A further official source request requires explicit workflow_dispatch.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: legacy-two-official-council-term-roots
  cancel-in-progress: false
jobs:
  official-legacy-term-roots:
    runs-on: macos-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/archive-foundation
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit original integrated 2339 archived sources
        run: python scripts/audit_stage_c.py --output /tmp/original-integrated-before-oldcity-oldcounty-roots.json
      - name: POST exactly two verified independent legacy council tree roots
        run: python -u scripts/probe_official_preintegration_roots_macos.py
      - name: Enforce original source immutable and request limit
        run: |
          python - <<'PY'
          import json
          d=json.load(open('reports/official-preintegration-root-trees-readonly-20261102.json'))
          assert d['request_limit']==2 and d['requests_attempted']==2 and d['retries']==0
          assert not d['archive_source_files_modified']
          assert not d['full_legacy_inventory_claimed']
          assert d['record_bodies_downloaded']==0
          assert not d['production_collection_enabled']
          assert d['status'] in {'PASS_BOTH_PREINTEGRATION_TERM_ROOTS','INCONCLUSIVE_PREINTEGRATION_ROOT_TREES'}
          PY
          git diff --exit-code -- archive indexes exports
      - name: Commit only verified source root nodes on feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/official-preintegration-root-trees-readonly-20261102.json
          if ! git diff --cached --quiet; then
            git commit -m "qa: retain independently verified legacy council official term root metadata"
            git fetch origin feature/archive-foundation
            git rebase origin/feature/archive-foundation
            git push origin HEAD:feature/archive-foundation
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-official-legacy-council-term-roots
          path: reports/official-preintegration-root-trees-readonly-20261102.json
          if-no-files-found: warn
