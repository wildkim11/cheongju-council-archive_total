name: Source smoke check

on:
  push:
    branches:
      - feature/archive-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-committee-probe:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect current committee rosters
        run: python -u scripts/collect_current_committees.py
      - name: Show report
        run: cat reports/current-committees.json
