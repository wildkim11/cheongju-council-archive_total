name: Source smoke check

on:
  push:
    branches:
      - feature/archive-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-research-group-probe:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect current research-group rosters
        run: python -u scripts/collect_current_research_groups.py
      - name: Show report
        run: cat reports/current-research-groups.json
