name: Source smoke check

on:
  push:
    branches:
      - feature/archive-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated-history-probe:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect integrated historical rosters without portraits
        run: python -u scripts/collect_integrated_historical_members.py --no-portraits
      - name: Show report
        run: cat reports/cheongju_integrated-historical-members.json
