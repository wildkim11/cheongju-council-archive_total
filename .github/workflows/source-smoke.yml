name: Source smoke check

on:
  push:
    branches:
      - feature/archive-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-committee-discovery:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover historical committee source candidates
        run: python -u scripts/discover_historical_committee_sources.py --max-pages 10
      - name: Show report
        run: cat reports/historical-committee-source-candidates.json
