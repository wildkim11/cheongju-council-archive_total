name: Source smoke check

on:
  push:
    branches:
      - feature/archive-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-markup-probe:
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe legacy member markup
        run: python -u scripts/probe_legacy_member_markup.py
