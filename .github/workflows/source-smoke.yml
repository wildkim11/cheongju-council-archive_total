name: Source smoke check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-root-probe:
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe official generation root
        run: python -u scripts/probe_official_source.py
