name: One-time oldcity oldcounty complete twelve-term official session inventory sizing
# Source-reading one-time QA completed. No push-triggered or recurring reruns.
# A further official source request requires explicit workflow_dispatch.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: preintegration-twelve-term-session-inventory
  cancel-in-progress: false
jobs:
  sessions-all-12-terms:
    runs-on: macos-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/archive-foundation
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit all existing integrated original meeting SHA-256
        run: python scripts/audit_stage_c.py --output /tmp/oldcity-oldcounty-twelve-session-before.json
      - name: Check only official 12 term immediate session trees no meeting bodies
        run: python -u scripts/probe_official_preintegration_all_term_sessions_macos.py
      - name: Require complete term sizing and read-only result
        run: |
          python - <<'PY'
          import json
          r=json.load(open('reports/official-preintegration-12-terms-sessions-readonly-20261102.json'))
          assert r['requests_attempted']==12 and r['retries']==0
          assert r['status']=='PASS_ALL_12_OFFICIAL_LEGACY_TERM_SESSION_COUNTS'
          assert r['all_12_term_session_branches_verified']
          assert len(r['official_term_session_counts'])==12
          assert r['total_verified_historical_session_nodes']>0
          assert not r['all_official_meeting_leaf_counts_verified']
          assert not r['full_legacy_meeting_body_backfill_completed']
          assert not r['legacy_archives_modified'] and not r['integrated_archive_modified']
          assert not r['production_sync_enabled']
          PY
          git diff --exit-code -- archive indexes exports
      - name: Commit only official source session counts to development branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/official-preintegration-12-terms-sessions-readonly-20261102.json
          if ! git diff --cached --quiet; then
            git commit -m "qa: verified separate historical city and county twelve-term official session counts"
            git fetch origin feature/archive-foundation
            git rebase origin/feature/archive-foundation
            git push origin HEAD:feature/archive-foundation
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-oldcity-oldcounty-all-term-session-counts
          path: reports/official-preintegration-12-terms-sessions-readonly-20261102.json
          if-no-files-found: warn
