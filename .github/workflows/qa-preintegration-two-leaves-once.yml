name: One-time old Cheongju city and Cheongwon county official meeting leaf drilldown
on:
  push:
    branches:
      - feature/archive-foundation
    paths:
      - .github/workflows/qa-preintegration-two-leaves-once.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: legacy-official-two-council-sample-leaves
  cancel-in-progress: false
jobs:
  two-legacy-leaves:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/archive-foundation
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 2339 original source bytes
        run: python scripts/audit_stage_c.py --output /tmp/before-legacy-leaf-probe.json
      - name: Drill into one official last session and committee per legacy council
        run: python -u scripts/probe_official_preintegration_sample_leaves_macos.py
      - name: Fail closed against archive edits and unauthorized queries
        run: |
          python - <<'PY'
          import json
          x=json.load(open('reports/official-preintegration-two-leaves-readonly-20261102.json'))
          assert x['request_cap']==8 and x['requests_attempted']<=8
          assert x['retries']==0
          assert x['meeting_bodies_fetched']==0
          assert not x['archive_source_files_modified']
          assert not x['all_terms_enumerated']
          assert not x['production_import_enabled']
          assert x['status'] in {'PASS_BOTH_INDEPENDENT_LEGACY_SCOPE_LEAF_BRANCHES','INCONCLUSIVE_LEGACY_LEAF_BRANCHES'}
          PY
          git diff --exit-code -- archive indexes exports
      - name: Publish metadata-only old-council leaf evidence in development branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/official-preintegration-two-leaves-readonly-20261102.json
          if ! git diff --cached --quiet; then
            git commit -m "qa: preserve one independently sourced historical council meeting leaf each"
            git fetch origin feature/archive-foundation
            git rebase origin/feature/archive-foundation
            git push origin HEAD:feature/archive-foundation
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: city-and-county-one-legacy-meeting-leaf-each
          path: reports/official-preintegration-two-leaves-readonly-20261102.json
          if-no-files-found: warn
